<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />

    <link rel="icon" type="image/png" href="/sweeto_logo.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SWEETO" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <!-- Open Graph Metadata for Social Previews (WhatsApp, Facebook, Twitter) -->
    <meta property="og:title" content="SWEETO HUB" />
    <meta property="og:description" content="SWEETO HUB - Local Storefront & Luxury Shopping" />
    <meta property="og:image" content="/sweeto_logo.png?v=2" />
    <meta property="og:type" content="website" />
    <title>SWEETO-HUB</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="root">
      <style>
        .pre-react-skeleton {
          width: 100%;
          min-height: 100vh;
          background-color: #020617; /* Dark theme default */
          padding: 1rem 1rem 5rem 1rem;
          box-sizing: border-box;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
        .skel-hero {
          width: 100%;
          max-width: 1440px;
          margin: 0 auto;
          height: 250px;
          border-radius: 2rem;
          background-color: #1e293b;
        }
        @media (min-width: 640px) { .skel-hero { height: 400px; } }
        @media (min-width: 768px) { .skel-hero { height: 500px; } }
        
        .skel-categories {
          width: 100%;
          max-width: 1440px;
          margin: 1rem auto;
          display: flex;
          gap: 1rem;
          overflow: hidden;
          padding: 1rem 0;
        }
        .skel-cat-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
          flex-shrink: 0;
        }
        .skel-cat-circle {
          width: 4rem;
          height: 4rem;
          border-radius: 50%;
          background-color: #1e293b;
        }
        .skel-cat-text {
          width: 3rem;
          height: 0.75rem;
          border-radius: 0.25rem;
          background-color: #1e293b;
        }

        .skel-header {
          width: 100%;
          max-width: 1440px;
          margin: 2rem auto 1rem auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .skel-header-title {
          width: 12rem;
          height: 2rem;
          border-radius: 0.5rem;
          background-color: #1e293b;
        }
        .skel-header-link {
          width: 6rem;
          height: 1rem;
          border-radius: 0.25rem;
          background-color: #1e293b;
        }

        .skel-grid {
          width: 100%;
          max-width: 1440px;
          margin: 0 auto;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.375rem; /* 1.5 equivalent */
        }
        @media (min-width: 640px) { .skel-grid { gap: 1.5rem; } }
        @media (min-width: 768px) { .skel-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .skel-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

        .skel-card {
          width: 100%;
          aspect-ratio: 3/4;
          border-radius: 1.8rem;
          background-color: #1e293b;
        }

        /* Light mode media query for flashing prevention */
        @media (prefers-color-scheme: light) {
          .pre-react-skeleton { background-color: #f8f9fa; }
          .skel-hero, .skel-cat-circle, .skel-cat-text, .skel-header-title, .skel-header-link, .skel-card { background-color: #e2e8f0; }
        }
      </style>
      <div class="pre-react-skeleton">
        <div class="skel-hero"></div>
        <div class="skel-categories">
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
          <div class="skel-cat-item"><div class="skel-cat-circle"></div><div class="skel-cat-text"></div></div>
        </div>
        <div class="skel-header">
          <div class="skel-header-title"></div><div class="skel-header-link"></div>
        </div>
        <div class="skel-grid">
          <div class="skel-card"></div><div class="skel-card"></div>
          <div class="skel-card"></div><div class="skel-card"></div>
          <div class="skel-card"></div><div class="skel-card"></div>
        </div>
      </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
